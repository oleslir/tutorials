<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rush Hour</title>
<style>
html,body{margin:0;min-height:100%;background:#0b1620;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:430px;text-align:center;background:#152535;border:1px solid #31465b;border-radius:20px;padding:24px;box-shadow:0 12px 36px #0008}.spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:#f4b52b;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#c9d5df;line-height:1.45}.version{margin-top:10px;font-size:12px;color:#7f93a6}.error{color:#ffb4b4}button{margin-top:18px;border:0;border-radius:12px;padding:12px 18px;background:#f4b52b;color:#15202b;font-weight:800;font-size:16px}iframe{position:fixed;left:-10000px;top:-10000px;width:10px;height:10px;border:0;opacity:0}
</style>
</head>
<body>
<main class="card"><div class="spinner"></div><h1>Rush Hour</h1><p id="status">Spillet indlæses uden fetch…</p><div class="version">iPhone Direct v5</div><button id="retry" hidden>Prøv igen</button></main>
<iframe id="source" src="payload-01.txt" aria-hidden="true"></iframe>
<script>
const status=document.getElementById('status');const retry=document.getElementById('retry');const frame=document.getElementById('source');
function fail(msg){document.querySelector('.spinner')?.remove();status.className='error';status.textContent='V5-fejl: '+msg;retry.hidden=false}
async function openGame(){
 try{
  const doc=frame.contentDocument||frame.contentWindow.document;
  const b64=(doc.body?.innerText||doc.documentElement?.textContent||'').replace(/\s+/g,'');
  if(b64.length<100000)throw new Error('payload mangler ('+b64.length+' tegn)');
  const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(!window.DecompressionStream)throw new Error('browseren mangler DecompressionStream');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  if(!html.toLowerCase().includes('<html'))throw new Error('udpakket fil er ugyldig');
  document.open();document.write(html);document.close();
 }catch(e){fail(e?.message||String(e))}
}
frame.addEventListener('load',openGame);
frame.addEventListener('error',()=>fail('payload-siden kunne ikke åbnes'));
retry.addEventListener('click',()=>location.reload());
setTimeout(()=>{if(document.querySelector('.spinner'))fail('timeout ved indlæsning af payload')},15000);
</script>
</body>
</html>
