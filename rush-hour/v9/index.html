<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rush Hour</title><style>html,body{margin:0;min-height:100%;background:#0b1620;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:420px;text-align:center;background:#152535;border:1px solid #31465b;border-radius:20px;padding:24px;box-shadow:0 12px 36px #0008}.spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:#f4b52b;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#c9d5df;line-height:1.45}.version{margin-top:10px;font-size:12px;color:#7f93a6}.error{color:#ffb4b4}</style></head><body><main class="card"><div class="spinner"></div><h1>Rush Hour</h1><p id="status">Spillet indlæses…</p><div class="version">Direct v9</div></main><script src="p01.js"></script><script src="p02.js"></script><script src="p03.js"></script><script src="p04.js"></script><script src="p05.js"></script><script src="p06.js"></script><script>(async()=>{const s=document.getElementById('status');try{const b64=window.__RH_PAYLOAD||'';if(b64.length!==74604)throw new Error('Spilfiler mangler ('+b64.length+' af 74604 tegn)');const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!window.DecompressionStream)throw new Error('Browseren skal opdateres');const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('.spinner')?.remove();s.className='error';s.textContent='V9-fejl: '+(e.message||e)}})();</script></body></html>
