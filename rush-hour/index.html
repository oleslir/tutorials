<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rush Hour</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1620;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{max-width:420px;text-align:center;background:#152535;border:1px solid #31465b;border-radius:20px;padding:24px;box-shadow:0 12px 36px #0008}
    .spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:#f4b52b;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#c9d5df;line-height:1.45}.error{color:#ffb4b4}
    button{margin-top:18px;border:0;border-radius:12px;padding:12px 18px;background:#f4b52b;color:#15202b;font-weight:800;font-size:16px}
    #payloadFrame{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px;top:-9999px}
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Rush Hour</h1>
    <p id="status">Spillet indlæses…</p>
    <button id="retry" hidden>Prøv igen</button>
  </main>
  <iframe id="payloadFrame" title="" aria-hidden="true"></iframe>
<script>
const status=document.getElementById('status');
const retry=document.getElementById('retry');
const frame=document.getElementById('payloadFrame');

function showError(error){
  document.querySelector('.spinner')?.remove();
  status.className='error';
  status.textContent='Spillet kunne ikke indlæses: '+(error?.message||error);
  retry.hidden=false;
}

async function unpackPayload(base64){
  const clean=base64.replace(/\s+/g,'');
  if(clean.length<1000) throw new Error('Spilfilen blev ikke indlæst korrekt');
  const bin=atob(clean);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window)) throw new Error('Browseren skal opdateres for at kunne åbne spillet');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!/<!doctype html/i.test(html.slice(0,100))) throw new Error('Den udpakkede spilfil er ugyldig');
  document.open();
  document.write(html);
  document.close();
}

function loadGame(){
  retry.hidden=true;
  status.className='';
  status.textContent='Spillet indlæses…';
  if(!document.querySelector('.spinner')){
    const spinner=document.createElement('div');
    spinner.className='spinner';
    spinner.setAttribute('aria-hidden','true');
    document.querySelector('.card').prepend(spinner);
  }
  frame.onload=async()=>{
    try{
      const doc=frame.contentDocument||frame.contentWindow.document;
      const text=(doc.body?.innerText||doc.body?.textContent||doc.documentElement?.textContent||'').trim();
      await unpackPayload(text);
    }catch(error){ showError(error); }
  };
  frame.onerror=()=>showError(new Error('Kunne ikke åbne spilfilen'));
  frame.src='./payload-01.txt?v=4&ts='+Date.now();
}

retry.addEventListener('click',loadGame);
loadGame();
</script>
</body>
</html>
