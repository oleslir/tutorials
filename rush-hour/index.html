<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rush Hour</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b1620;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{max-width:420px;text-align:center;background:#152535;border:1px solid #31465b;border-radius:20px;padding:24px;box-shadow:0 12px 36px #0008}
    .spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:#f4b52b;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#c9d5df;line-height:1.45}.error{color:#ffb4b4}
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Rush Hour</h1>
    <p id="status">Spillet indlæses…</p>
  </main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const r=await fetch('./payload-01.txt',{cache:'no-store'});
    if(!r.ok) throw new Error('Kunne ikke hente spillet');
    const b64=(await r.text()).trim();
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('Denne browser understøtter ikke den nødvendige udpakning. Opdater Safari.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.querySelector('.spinner')?.remove();
    status.className='error';
    status.textContent='Spillet kunne ikke indlæses: '+(e?.message||e);
  }
})();
</script>
</body>
</html>
